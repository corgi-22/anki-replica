<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#5856D6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <g filter="url(#shadow)">
    <!-- 底層傾斜卡片 -->
    <rect x="130" y="110" width="220" height="290" rx="28" fill="#FFFFFF" opacity="0.35" transform="rotate(-10 240 255)" />
    <!-- 頂層正面卡片 -->
    <rect x="156" y="115" width="220" height="290" rx="28" fill="#FFFFFF" />
    <!-- 卡片內容線條 -->
    <rect x="190" y="170" width="150" height="24" rx="12" fill="#007AFF" />
    <rect x="190" y="220" width="100" height="14" rx="7" fill="#8E8E93" opacity="0.5" />
    <rect x="190" y="250" width="130" height="14" rx="7" fill="#8E8E93" opacity="0.3" />
    <!-- 閃光/星芒標誌 -->
    <circle cx="266" cy="335" r="24" fill="#34C759" />
    <path d="M256 335 L263 342 L278 327" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
